<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Українська література</title>
    <link rel="stylesheet" href="style.css"> <style>
        /* Додаткові стилі суто для цієї сторінки */
        .subject-card {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }
        .zoom-link {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            background: #4a90e2;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
        }

        /* Контейнер для інфи про доступ */
        .access-info {
            margin: 25px 0;
            padding: 15px;
            background-color: #f8f9fa;
            /* Світло-сірий фон */
            border-radius: 10px;
            border: 1px dashed #4a90e2;
            /* Пунктирна рамка */
            display: inline-block;
            text-align: left;
        }

        /* Окремі рядочки (ID та Пароль) */
        .info-item {
            margin: 8px 0;
            font-size: 1.1rem;
        }

        .info-item span {
            color: #666;
            margin-right: 10px;
        }

        /* Стиль самого коду (жирний, можна копіювати) */
        .copy-text {
            font-family: monospace;
            /* Моноширинний шрифт як у програмістів */
            background: #eee;
            padding: 2px 6px;
            border-radius: 4px;
            color: #d63384;
            /* Яскравий колір для коду */
        }

        /* Кнопка повернення */
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #888;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: #4a90e2;
            text-decoration: underline;
        }

        .lesson-btn {
          padding: 15px 30px;
          background-color: #2D8CFF; /* Фірмовий синій колір Zoom */
          color: white;
          border: none;
          border-radius: 8px;
          font-size: 18px;
          font-weight: bold;
          cursor: pointer;
            box-shadow: 0 4px 6px rgba(45, 140, 255, 0.3);
          transition: all 0.2s ease;
        }
    .lesson-btn:hover {
  background-color: #1a73e8;
  transform: translateY(-2px);
}
    </style>
</head>
<body style="background: #f4f7f6;">

    <div class="subject-card">
        <h1>Українська література 📚</h1>
        <p>Вчитель: Калініченко Валентина Борисівна</p>
        <hr>
        <p>Тут може буде колись домашнє завдання або корисні файли.</p>
        
        <p>новий спосіб</p>
        <button onclick="openLesson()" class="lesson-btn">
            🎒 Увійти на онлайн-урок в Zoom
        </button>

        <p>старий спосіб</p>
        <a href="https://us04web.zoom.us/j/73467194484?pwd=ajjEsZLcKipqjIjRcaeOlUtRMzoAwm.1" class="zoom-link" target="_blank">
            Увійти в Zoom конференцію
        </a>
        <div class="access-info">
        <div class="info-item">
            <span>Ідентифікатор:</span>
            <strong class="copy-text">???</strong> </div>
        <div class="info-item">
            <span>Код доступу:</span>
            <strong class="copy-text">???</strong> </div>
        </div>
        <br><br>
        <a href="index.html" style="color: #888;">← Повернутися до розкладу</a>
    </div>

    <script>
function openLesson() {
  // 1. Ваше оригінальне посилання (сюди можна вставляти нове, якщо зміниться)
  const webLink = "https://us04web.zoom.us/j/73467194484?pwd=ajjEsZLcKipqjIjRcaeOlUtRMzoAwm.1";

  // Визначаємо пристрій учня
  const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  
  // 2. Автоматично перетворюємо посилання під правильний протокол Zoom
  let appLink = "";
  if (isMobile) {
    // Для телефонів міняємо https:// на zoomus://
    appLink = webLink.replace("https://", "zoomus://");
  } else {
    // Для комп'ютерів міняємо домен на zoommtg та трансформуємо структуру
    appLink = webLink.replace("https://us04web.zoom.us/j/", "zoommtg://us04web.zoom.us/join?confno=")
                     .replace("?pwd=", "&pwd=");
  }

  let appOpened = false;

  // Перевіряємо, чи запустився додаток (вкладка згорнулася)
  window.addEventListener('blur', function() {
    appOpened = true;
  });

  // Пробуємо відкрити додаток Zoom
  window.location.href = appLink;

  // Якщо через 2.5 секунди додаток не відкрився — запускаємо веб-версію в браузері
  setTimeout(function() {
    if (!appOpened) {
      window.location.href = webLink;
    }
  }, 2500);
}
</script>
</body>
</html>
