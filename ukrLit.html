<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Українська література</title>
    <link rel="stylesheet" href="style.css"> <style>
        /* Додаткові стилі суто для цієї сторінки */
        .subject-card {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }
        .zoom-link {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            background: #4a90e2;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
        }

        /* Контейнер для інфи про доступ */
        .access-info {
            margin: 25px 0;
            padding: 15px;
            background-color: #f8f9fa;
            /* Світло-сірий фон */
            border-radius: 10px;
            border: 1px dashed #4a90e2;
            /* Пунктирна рамка */
            display: inline-block;
            text-align: left;
        }

        /* Окремі рядочки (ID та Пароль) */
        .info-item {
            margin: 8px 0;
            font-size: 1.1rem;
        }

        .info-item span {
            color: #666;
            margin-right: 10px;
        }

        /* Стиль самого коду (жирний, можна копіювати) */
        .copy-text {
            font-family: monospace;
            /* Моноширинний шрифт як у програмістів */
            background: #eee;
            padding: 2px 6px;
            border-radius: 4px;
            color: #d63384;
            /* Яскравий колір для коду */
        }

        /* Кнопка повернення */
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #888;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: #4a90e2;
            text-decoration: underline;
        }
    </style>
</head>
<body style="background: #f4f7f6;">

    <div class="subject-card">
        <h1>Українська література 📚</h1>
        <p>Вчитель: Калініченко Валентина Борисівна</p>
        <hr>
        <p>Тут може буде колись домашнє завдання або корисні файли.</p>
        
        <a href="" class="zoom-link" target="_blank">
            Увійти в Zoom конференцію
        </a>
        <div class="access-info">
        <div class="info-item">
            <span>Ідентифікатор:</span>
            <strong class="copy-text"></strong> </div>
        <div class="info-item">
            <span>Код доступу:</span>
            <strong class="copy-text"></strong> </div>
        </div>
        <br><br>
        <a href="index.html" style="color: #888;">← Повернутися до розкладу</a>
    </div>

</body>
</html>
