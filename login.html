<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вхід | Шкільний Щоденник 7-В</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
}

.login-box{
    background:white;
    padding:40px;
    width:360px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    text-align:center;
    animation:fade 0.6s;
}

@keyframes fade{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:translateY(0)}
}

h2{
    margin-bottom:25px;
}

input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:15px;
    transition:0.2s;
}

input:focus{
    border-color:#4facfe;
    outline:none;
    box-shadow:0 0 5px rgba(79,172,254,0.4);
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background:#4facfe;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    background:#3793ff;
    transform:scale(1.02);
}

.error{
    color:red;
    min-height:20px;
    font-size:14px;
    margin-top:5px;
}

.info{
    font-size:13px;
    color:#555;
    margin-top:10px;
}

</style>
</head>

<body>

<div class="login-box">

<h2>🔐 Вхід у систему</h2>

<input type="text" id="username" placeholder="Ім'я користувача">

<input type="password" id="password" placeholder="Пароль">

<div id="error" class="error"></div>

<button onclick="login()">Увійти</button>

<p class="info">Якщо ви забули логін або пароль — напишіть адміністрації у Viber.</p>
<p class="info">Якщо виникли проблеми з входом — також зверніться до адміністрації.</p>

</div>

<script>

const isLoginAllowed = false;

const loginBanReason =
"Логін ще не працює. Спробуйте пізніше — сайт ще готується.";

function md5(str){
return CryptoJS.MD5(str).toString();
}

const users={
"admin":{hash:"",role:"admin",id:"0001"},
"Slavik":{hash:"",role:"admin",id:"0002"}
};

function login(){

const username=document.getElementById("username").value.trim();
const password=document.getElementById("password").value.trim();
const errorDiv=document.getElementById("error");

if(!isLoginAllowed){
errorDiv.textContent="🚫 Вхід заборонено: "+loginBanReason;
return;
}

if(users[username] && users[username].hash===md5(password).toLowerCase()){

const userData=users[username];

localStorage.setItem("loggedIn","true");
localStorage.setItem("username",username);
localStorage.setItem("role",userData.role);
localStorage.setItem("userid",userData.id);
localStorage.setItem("userAchievements",userData.achievements || "00000000000000");

if(userData.role==="admin"){
window.location.href="admin.html";
}
else if(userData.role==="teacher"){
window.location.href="teacher.html";
}
else if(userData.role==="ml-admin"){
window.location.href="ml-admin.html";
}
else if(userData.role==="english-teacher"){
window.location.href="english.html";
}
else{
window.location.href="index.html";
}

}
else{
errorDiv.textContent="❌ Неправильне ім'я користувача або пароль!";
}

}

document.addEventListener("keydown",function(e){
if(e.key==="Enter"){
login();
}
});

</script>

</body>
</html>
